services:
  app:
    build: .
    working_dir: /workspace
    environment:
      UV_LINK_MODE: copy
      UV_GROUPS: ${UV_GROUPS:---all-groups}
    volumes:
      - .:/workspace
      - python-venv:/workspace/.venv
      - uv-cache:/root/.cache/uv
    command: ["sh", "-c", "make sync && uv run --locked $$UV_GROUPS python -m example_app"]

volumes:
  python-venv:
  uv-cache:
