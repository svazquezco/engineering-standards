_min_copier_version: "9.17"
_templates_suffix: .jinja
_skip_if_exists:
  - "**/*.py"
_exclude:
  - copier.yml
  - "{% if framework != 'fastapi' %}**/main.py{% endif %}"
  - "{% if framework != 'fastapi' %}**/routers{% endif %}"
  - "{% if framework != 'fastmcp' %}**/server.py{% endif %}"

framework:
  type: str
  choices:
    FastAPI: fastapi
    FastMCP: fastmcp
  default: fastapi

package_name:
  type: str
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Enter a snake_case package name starting with a lowercase letter.
    {% elif package_name in ('and', 'as', 'assert', 'async', 'await', 'break', 'class',
      'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from',
      'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or',
      'pass', 'raise', 'return', 'try', 'while', 'with', 'yield') %}
    Enter a package name that is not a Python keyword.
    {% endif %}
